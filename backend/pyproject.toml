[project]
name = "backend"
version = "0.1.0"
description = "Backend for the Gardenerd application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.7",
    "django-environ>=0.14.0",
    "django-storages[s3]>=1.14.6",
    "pillow>=11.3.0",
    "psycopg[binary]>=3.3.2",
    "strawberry-graphql-django>=0.86.4",
    "whitenoise>=6.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gardenerd.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "single"
