name: Docker

on:
  pull_request:
    branches:
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: gardenerd-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: gardenerd-frontend:ci

  compose-smoke:
    name: Compose Smoke Test
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: gardenerd
      POSTGRES_USER: gardenerd
      POSTGRES_PASSWORD: ci-postgres-password
      DJANGO_SECRET_KEY: ci-django-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FRONTEND_PORT: "3000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Start compose stack
        run: docker compose up -d --build

      - name: Wait for frontend
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          exit 1

      - name: Verify frontend smoke response
        run: curl --fail --silent --show-error http://127.0.0.1:3000 | grep --fixed-strings "Gardenerd"

      - name: Verify GraphQL health through frontend
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --data '{"query":"{ health }"}' \
              http://127.0.0.1:3000/graphql \
              | grep --extended-regexp '"health"[[:space:]]*:[[:space:]]*"ok"'; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          exit 1

      - name: Start and reload a persisted Growing Trial
        run: |
          endpoint=http://127.0.0.1:3000/graphql
          plant_response=$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"query":"mutation { createPlant(name: \"Smoke Radish\") { id } }"}' \
            "$endpoint")
          plant_id=$(jq --exit-status --raw-output '.data.createPlant.id' <<<"$plant_response")

          container_response=$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"query":"mutation { createContainer(name: \"Smoke Pot\") { id } }"}' \
            "$endpoint")
          container_id=$(jq --exit-status --raw-output '.data.createContainer.id' <<<"$container_response")

          create_payload=$(jq --null-input --compact-output \
            --arg plant_id "$plant_id" --arg container_id "$container_id" \
            '{query: "mutation($plantId: ID!, $containerId: ID!) { createGrowingTrial(plantId: $plantId, containerId: $containerId) { id } }", variables: {plantId: $plant_id, containerId: $container_id}}')
          trial_response=$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' --data "$create_payload" "$endpoint")
          trial_id=$(jq --exit-status --raw-output '.data.createGrowingTrial.id' <<<"$trial_response")

          start_payload=$(jq --null-input --compact-output \
            --arg id "$trial_id" --arg start_date "$(date --utc +%F)" \
            '{query: "mutation($id: ID!, $startDate: Date!) { startGrowingTrial(id: $id, startDate: $startDate, startMethod: SEED, timeZone: \"UTC\") { id status startDate } }", variables: {id: $id, startDate: $start_date}}')
          start_response=$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' --data "$start_payload" "$endpoint")
          jq --exit-status \
            --arg id "$trial_id" \
            '.data.startGrowingTrial | select(.id == $id and .status == "ACTIVE")' \
            <<<"$start_response"

          docker compose restart backend
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --data '{"query":"{ health }"}' "$endpoint" >/dev/null; then
              break
            fi
            sleep 2
          done

          persisted_response=$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"query":"{ growingTrials { items { id status startDate } } }"}' \
            "$endpoint")
          jq --exit-status \
            --arg id "$trial_id" \
            '.data.growingTrials.items[] | select(.id == $id and .status == "ACTIVE" and .startDate != null)' \
            <<<"$persisted_response"

      - name: Dump compose logs
        if: failure()
        run: docker compose logs

      - name: Stop compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
